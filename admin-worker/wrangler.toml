# support.sanbada 관리자 페이지 (Cloudflare Worker)
# 배포: Cloudflare 대시보드 → Workers & Pages → 만들기 → GitHub 저장소 연결 → 루트 디렉터리 admin-worker
name = "sanbada-admin"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true   # 화면 파일도 로그인 확인을 먼저 거치게 함

[vars]
REPO = "sanbadasports-support/support.sanbada"
BRANCH = "main"
FILE = "data/content.json"
SITE_URL = "https://support.sanbadasports.co.kr/"
# Access 값 (2026-11-26 설정: 허용 메일 = @sanbadasports.co.kr)
ACCESS_TEAM = "crimson-recipe-4cd1.cloudflareaccess.com"   # Zero Trust 팀 도메인
ACCESS_AUD = "abb0733d63d2c479e7463b23ec146c986d65a9c6d3d2830226590d0344b9a96e"   # sanbada-admin Access 앱 AUD
# 비밀값(대시보드에서 「암호화」로 추가, 이 파일에 적지 말 것): GITHUB_TOKEN

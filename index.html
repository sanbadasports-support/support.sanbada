:root{
  --bg:#f5f6f7; --surface:#ffffff; --ink:#15191d; --muted:#5b646d; --line:#e1e4e8;
  --accent:#0b6b66; --accent-soft:#e3f1ef; --accent-ink:#ffffff;
  --warn:#a8501a; --warn-soft:#fbeee4; --ok:#2f7a3b;

  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1214; --surface:#171b1e; --ink:#eceff1; --muted:#9aa3ab; --line:#2a3035;
  --accent:#43b5ab; --accent-soft:#16302d; --accent-ink:#06201d; --warn:#f0a070; --warn-soft:#3a2416; --ok:#7cc488; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#171b1e; --ink:#eceff1; --muted:#9aa3ab; --line:#2a3035;
  --accent:#43b5ab; --accent-soft:#16302d; --accent-ink:#06201d; --warn:#f0a070; --warn-soft:#3a2416; --ok:#7cc488; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:56px}
.logo{font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo span{color:var(--muted);font-weight:500;margin-left:6px}
nav.main{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav.main a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:8px;white-space:nowrap}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--bg)}
.demo{background:var(--accent-soft);color:var(--ink);font-size:14px;text-align:center;padding:8px 16px}
main{padding-block:0 80px}
.hero{text-align:center;padding-block:56px 32px}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:8px 0 0}
.search{position:relative;max-width:620px;margin:28px auto 0}
.search input{width:100%;font:inherit;font-size:17px;padding:14px 18px 14px 46px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input:focus,input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.results{max-width:620px;margin:10px auto 0;text-align:left}
.sec{padding-block:36px 0}
.sec>h2{font-size:22px;font-weight:600;margin-bottom:18px}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.brand{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:116px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.brand:hover{border-color:var(--accent);transform:translateY(-2px)}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:13px}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.way{padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.way h3{font-size:17px;font-weight:600;margin-bottom:6px}
.way p{margin:0 0 12px;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;padding:11px 20px;border-radius:999px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.small{font-size:14px;padding:7px 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:16px 36px 16px 0;position:relative;font-weight:500}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:12px;font-size:22px;color:var(--muted);font-weight:400}
.faq details[open] summary::after{content:"−"}
.faq .ans{padding:0 0 18px;color:var(--ink);white-space:pre-line;max-width:65ch}
.faq .ans .meta{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;margin-right:6px;vertical-align:2px}
.crumb{font-size:14px;color:var(--muted);padding-top:28px}
.crumb a{text-decoration:none}
.bhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-block:14px 8px}
.bhead h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.02em}
.bhead p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:20px;overflow-x:auto}
.tabs button{font:inherit;font-size:15px;background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.panel{padding-top:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.serialimg{background:#fff;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;max-width:640px}
.serialimg img{display:block;width:100%}
.note{padding:14px 16px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.docs{display:grid;gap:10px;max-width:640px}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.doc span{color:var(--muted);font-size:13px;white-space:nowrap}
.cta{margin-top:32px;padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.cta h3{font-size:18px;font-weight:600}
.cta p{margin:2px 0 0;color:var(--muted);font-size:14px}

.steps{display:flex;gap:6px;margin:28px 0 8px}

.steps i.on{background:var(--accent)}

/* ===== 데이터 불러오기: data/*.json 이 있으면 쓰고, 없으면(파일로 열었을 때 등) 이 파일 안의 기본값을 씀 ===== */
let DEALERS=JSON.parse(document.getElementById("dealers-embed").textContent);
async function getJSON(p){if(location.protocol==="file:")return null;try{const r=await fetch(p+"?v="+Math.floor(Date.now()/6e5),{cache:"no-store"});if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function loadData(){
  const [d,c]=await Promise.all([getJSON("data/dealers.json"),getJSON("data/content.json")]);
  if(Array.isArray(d)&&d.length>50)DEALERS=d;
  if(c&&typeof c==="object"){
    if(c.settings)Object.assign(CONTENT,c.settings);
    if(Array.isArray(c.faq)&&c.faq.length){FAQ.length=0;c.faq.forEach(x=>FAQ.push(x))}
    if(Array.isArray(c.brands)&&c.brands.length){c.brands.forEach(nb=>{const o=BRANDS.find(b=>b.id===nb.id);if(o)Object.assign(o,nb);else BRANDS.push(nb)});
      BRANDS.sort((a,b)=>(a.order??99)-(b.order??99))}
  }
  const n=document.getElementById("notice");if(CONTENT.notice){n.textContent=CONTENT.notice;n.hidden=false}
  document.getElementById("foot").textContent=`산바다스포츠 기술팀 · ${CONTENT.address} · 대표 ${CONTENT.phone} · ${CONTENT.hours}`;
}

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brandOf=id=>BRANDS.find(b=>b.id===id);
const faqItem=(f,showBrand)=>`<details><summary><span class="tag">${esc(f.t)}</span>${esc(f.q)}</summary><div class="ans">${esc(f.a)}${showBrand&&f.b.length?`<span class="meta">해당 브랜드: ${f.b.map(x=>brandOf(x).name).join(", ")}</span>`:""}</div></details>`;
const catsFor=b=>CATS.filter(c=>!c.only||(b&&b[c.only]));
const faqFor=(bid,cat)=>FAQ.filter(f=>(!bid||!f.b.length||f.b.includes(bid))&&(!cat||f.c.includes(cat)));

/* ---------- 홈 ---------- */
function home(){
  app.innerHTML=`

    <p>${esc(CONTENT.heroText)}</p>

  </section>
  <section class="sec wrap"><h2>어떻게 도와드릴까요?</h2>
    <div class="ways">
      <div class="way"><h3>온라인 A/S 접수</h3><p>사진과 증상을 올리면 접수번호가 바로 나오고, 진행 상황은 알림톡으로 알려 드려요.</p><a class="btn small" href="#apply">접수 시작</a></div>
      <div class="way"><h3>진행 조회</h3><p>접수번호와 연락처 뒤 4자리로 지금 어디까지 진행됐는지 확인해요.</p><a class="btn small ghost" href="#track">조회하기</a></div>
      <div class="way"><h3>가까운 대리점</h3><p>진단이 필요한 증상은 가까운 취급 대리점에서 먼저 보는 게 가장 빨라요.</p><a class="btn small ghost" href="${esc(CONTENT.dealerFinder)}" target="_blank" rel="noopener">대리점 찾기</a></div>
      <div class="way"><h3>카카오톡 상담</h3><p>접수 전에 궁금한 점은 카카오톡 채널 「산바다스포츠기술팀」으로 물어보세요.</p><span class="hint">${esc(CONTENT.hours)}</span></div>
    </div>
  </section>
  <section class="sec wrap"><h2>자주 묻는 질문</h2><div class="faq">${FAQ.filter(f=>!f.b.length).map(f=>faqItem(f)).join("")}</div></section>`;
  const q=$("#q"),r=$("#qres");
  q.addEventListener("input",()=>{

  });
}

/* ---------- 브랜드 ---------- */
let brandTab="issues",brandCat=null;
function brand(id){
  const b=brandOf(id); if(!b){location.hash="home";return}
  const tabs=[["issues","자주 발생하는 문제"],["serial","시리얼 위치"],["docs","매뉴얼·자료"]];
  const cats=catsFor(b);
  let body="";
  if(brandTab==="issues"){
    const list=faqFor(b.id,brandCat);
    body=`<div class="chips" role="group" aria-label="증상 분류"><button class="chip" data-cat="" aria-pressed="${!brandCat}">전체</button>${cats.map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${brandCat===c.id}">${c.name}</button>`).join("")}</div>
      <div class="faq">${list.length?list.map(f=>faqItem(f)).join(""):`<p class="hint" style="padding:14px 0">이 분류에는 아직 안내가 없어요. 바로 접수해 주시면 담당자가 확인해 드려요.</p>`}</div>`;
  }else if(brandTab==="serial"){
    body=b.img?`<p style="margin-top:0">접수할 때 시리얼(프레임) 번호 사진이 꼭 필요해요. 아래 위치에서 찾아 주세요.</p><div class="serialimg"><img src="img/serial-${b.id}.jpg" alt="${esc(b.name)} 시리얼 번호 위치 안내" loading="lazy"></div>`
      :`<div class="note">가민·Tacx 제품은 기기 뒷면 라벨 또는 설정 메뉴의 「기기 정보」에서 시리얼 번호를 확인할 수 있어요.</div>`;
  }else{
    body=`<div class="docs">${(b.docs||[]).map(d=>{const t=typeof d==="string"?d:d.t,u=typeof d==="string"?"":(d.u||"");
        return u&&/^https?:\/\//.test(u)?`<a class="doc" href="${esc(u)}" target="_blank" rel="noopener"><div>${esc(t)}</div><span>열기 ↗</span></a>`:`<div class="doc"><div>${esc(t)}</div><span>자료 준비 중</span></div>`}).join("")}</div>`;
  }
  app.innerHTML=`<div class="wrap">
    <div class="crumb"><a href="#home">지원 홈</a> › ${esc(b.name)}</div>
    <div class="bhead"><div><h1>${esc(b.name)} 지원</h1><p>${esc(b.kind)}</p></div></div>
    ${b.id==="garmin"?`<div class="note warn" style="margin-top:12px">가민 기기(엣지·랠리 등)는 가민코리아에서 직접 접수해요. Tacx 트레이너만 산바다스포츠에서 접수합니다.</div>`:""}
    <div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${brandTab===k}">${n}</button>`).join("")}</div>
    <div class="panel">${body}</div>
    <div class="cta"><div><h3>해결되지 않았나요?</h3><p>사진과 증상을 올려 주시면 담당자가 확인 후 알림톡으로 안내해 드려요.</p></div>
      <a class="btn" href="#apply-${b.id}">A/S 접수하기</a></div>
  </div>`;
  app.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>{brandTab=t.dataset.tab;brand(id)});
  app.querySelectorAll("[data-cat]").forEach(t=>t.onclick=()=>{brandCat=t.dataset.cat||null;brand(id)});
}

function save(){
  const v=id=>{const e=document.getElementById(id);return e?e.value.trim():undefined};
  [["model","f-model"],["serial","f-serial"],["buy","f-buy"],["symptom","f-sym"],["name","f-name"],["cname","f-cname"],["staff","f-staff"],["phone","f-phone"],["email","f-email"]]

  const hp=document.getElementById("f-hp"); if(hp)F.hp=hp.value;
}
const digits=s=>String(s||"").replace(/\D/g,"");
function check(){
  const w=F.kind==="warranty";
  if(step===0){if(!F.who)return"접수처를 골라 주세요.";if(!F.kind)return"접수 구분을 골라 주세요.";if(!F.brand)return"브랜드를 골라 주세요.";if(F.who==="consumer"&&F.brand!=="tacx")return"소비자 직접 접수는 Tacx만 가능해요. 다른 브랜드는 대리점에서 접수해 주세요."}
  if(step===1){
    if(!F.serial&&!F.serialByPhoto)return"시리얼 번호를 적어 주세요. 못 찾겠으면 「번호를 못 찾겠어요」를 눌러 사진으로 올려 주세요.";
    if(F.serial&&!/^[A-Za-z0-9\-\/ ]{3,40}$/.test(F.serial))return"시리얼 번호는 영문과 숫자로만 적어 주세요.";
    if(!F.model&&!F.product&&!F.serialByPhoto)return"모델명을 적어 주세요.";
    if(w&&!F.buy)return"워런티 접수는 구매일이 필요해요.";if(!F.cat)return"문제 분류를 골라 주세요.";if(F.symptom.length<5)return"증상을 조금 더 자세히 적어 주세요."}
  if(step===2){const miss=needPhotos().filter(k=>!F.photos[k]);
    if(miss.length){miss.forEach(k=>{const e=document.querySelector(`[data-slot="${k}"]`);if(e)e.classList.add("need")});
      return w?"워런티 접수는 제품 전체, 시리얼, 문제 부위 사진과 영수증이 모두 필요해요.":"시리얼 번호 사진을 올려 주세요."}}
  if(step===3){
    if(F.who==="dealer"&&!F.dealer)return"대리점을 목록에서 골라 주세요.";
    if(F.who==="consumer"&&!F.name)return"성함을 적어 주세요.";
    if(F.who!=="consumer"&&!F.cname)return"소비자 성함을 적어 주세요.";
    if(!/^0\d{8,11}$/.test(digits(F.phone)))return"연락처를 확인해 주세요. (예: 010-1234-5678)";
    if(F.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(F.email))return"이메일 주소를 확인해 주세요.";
    if(!F.agree)return"개인정보 수집·이용에 동의해야 접수할 수 있어요."}
  return"";
}
/* 사진 줄이기: 긴 변 1600px JPEG, base64(앞부분 data: 없이) */
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const M=CONFIG.PHOTO_MAX;let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
    ok(c.toDataURL("image/jpeg",CONFIG.PHOTO_QUALITY).split(",")[1])};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("사진을 열 수 없어요. JPG나 PNG로 올려 주세요."))};im.src=u})}
async function post(url,data){
  const body=new URLSearchParams();Object.entries(data).forEach(([k,v])=>body.append(k,v==null?"":String(v)));
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),CONFIG.TIMEOUT_MS);
  try{const r=await fetch(url,{method:"POST",body,signal:ctl.signal});const txt=await r.text();
    try{return JSON.parse(txt)}catch(e){return{ok:r.ok,raw:txt}}}finally{clearTimeout(t)}}
/* 시리얼 자동완성 */
const serialCache={};let serialTimer=null,serialSeq=0;
async function serialLookup(q){
  const key=q.toUpperCase();if(serialCache[key])return serialCache[key];
  const r=await post(CONFIG.HOOK_LOOKUP,{a:"serial",q});
  const out=[];((r&&r.boards)||[]).forEach(b=>((b.items_page||{}).items||[]).forEach(it=>{const g=id=>((it.c||[]).find(c=>c.id===id)||{}).text||"";out.push({serial:g("serial").toUpperCase(),name:g("product_name")})}));
  return serialCache[key]=out.slice(0,8);
}
function dealerMatch(v){v=v.replace(/\s/g,"").toLowerCase();if(!v)return[];
  return DEALERS.filter(d=>(d.n+d.r+d.a).replace(/\s/g,"").toLowerCase().includes(v)).slice(0,30)}

    const lab=inp.closest(".drop");lab.querySelector(".x").textContent="줄이는 중…";
    try{F.photos[inp.dataset.photo]=await shrink(f);apply()}catch(e){$("#err").textContent=e.message;lab.querySelector(".x").textContent="다시 올리기"}});

      if(q.length<3||!/^[A-Za-z0-9\-]+$/.test(q)){box.hidden=true;return}
      const my=++serialSeq;serialTimer=setTimeout(async()=>{box.hidden=false;box.innerHTML=`<span class="hint" style="display:block;padding:10px 13px">찾는 중…</span>`;

        if(my!==serialSeq)return;

          :`<span class="hint" style="display:block;padding:10px 13px">등록된 번호에서 찾지 못했어요. 적은 번호 그대로 접수돼요.</span>`;
        box.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{si.value=bt.dataset.s;F.serial=bt.dataset.s;F.product=bt.dataset.n;box.hidden=true;
          save();if(!F.model)F.model=F.product;apply()})},CONFIG.LOOKUP_DEBOUNCE_MS)}}
  const dl=$("#f-dealer"); if(dl){const box=$("#dl");
    dl.oninput=()=>{F.dealer="";F.dealerName=dl.value.trim();$("#d-hint").textContent="목록에서 골라 주세요.";const hit=dealerMatch(dl.value);box.hidden=!dl.value.trim();
      box.innerHTML=hit.length?hit.map(d=>`<button type="button" data-id="${esc(d.id)}" data-n="${esc(d.n)}">${esc(d.n)} <small class="hint">${esc([d.r,d.a].filter(Boolean).join(" "))}</small></button>`).join("")
        :`<span class="hint" style="display:block;padding:10px 13px">찾는 대리점이 없어요. 이름을 다르게 넣어 보거나 카카오톡 채널로 알려 주세요.</span>`;
      box.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{F.dealer=bt.dataset.id;F.dealerName=bt.dataset.n;dl.value=bt.dataset.n;box.hidden=true;$("#d-hint").textContent="✓ 선택됨. 대리점 연락처는 등록 정보로 자동 입력돼요."})}}
  const back=$("#back"); if(back)back.onclick=()=>{save();step--;apply();scrollTo(0,0)};
  $("#wiz").onsubmit=e=>{e.preventDefault();if(sending)return;save();const m=check();if(m){$("#err").textContent=m;return}
    if(step<4){step++;apply();scrollTo(0,0)}else submit()};
}
async function submit(){
  sending=true;const go=$("#go");go.disabled=true;go.textContent="접수하는 중… (15초쯤 걸려요)";$("#err").textContent="";
  const brandId=F.brand==="tacx"?"tacx":F.brand;
  const data={k:CONFIG.KEY,hp:F.hp||"",who:F.who,kind:F.kind,brand:brandId,model:F.model||F.product,serial:F.serial,buy:F.buy,
    cat:(CATS.find(c=>c.id===F.cat)||{}).name||"기타",symptom:F.symptom,name:F.name,dealer:F.dealer,dealer_name:F.dealerName,staff:F.staff,cname:F.cname,
    phone:digits(F.phone),email:F.email,agree:F.agree?"1":"",nphotos:Object.keys(F.photos).length,product_name:F.product,
    ph_whole:F.photos.whole||"",ph_serial:F.photos.serial||"",ph_issue:F.photos.issue||"",ph_issue2:F.photos.issue2||"",ph_issue3:F.photos.issue3||"",ph_receipt:F.photos.receipt||""};
  try{const r=await post(CONFIG.HOOK_SUBMIT,data);
    if(r&&r.ok){done(r.no||"");return}
    throw new Error("bad")}
  catch(e){sending=false;go.disabled=false;go.textContent="다시 접수하기";
    $("#err").innerHTML=`접수를 보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. 계속 안 되면 ${esc(CONTENT.phone)} 또는 카카오톡 채널로 알려 주세요.`;}
}
function done(no){
  sending=false;
  const ph=digits(F.phone).slice(-4);
  app.innerHTML=`<div class="wrap narrow"><div class="card done">
    <h2>접수되었어요</h2><p class="sub" style="margin:6px 0 0">${no?"접수번호를 꼭 저장해 주세요. 진행 조회와 문의에 쓰여요.":"접수번호는 곧 알림톡으로 보내 드려요."}</p>
    ${no?`<div class="ticket">${esc(no)}</div><div class="hint">진행 조회: 접수번호 + 연락처 뒤 4자리${F.who==="dealer"?"(대리점 또는 소비자 번호)":" "+esc(ph)}</div>`:""}
    <ol class="timeline">${TRACK_STEPS.map((s,i)=>`<li class="${i===0?"on now":""}"><b>${s.t}</b><small>${i===0?"방금 · 접수 확인 알림톡이 발송돼요":s.d}</small></li>`).join("")}</ol>
    <div class="nav-btns" style="justify-content:center">${no?`<a class="btn ghost" href="#track-${esc(no)}">진행 조회</a>`:""}<a class="btn" href="#home" id="newf">처음으로</a></div>
  </div></div>`;
  $("#newf").onclick=()=>resetForm();resetForm();scrollTo(0,0);
}

/* ---------- 조회 ---------- */
const TRACK_STEPS=[
 {t:"접수 완료",d:"",s:["신규접수"]},
 {t:"담당자 1차 안내",d:"보통 1영업일 안에 진단·입고 방법을 알려 드려요",s:["1차 안내 완료","입고 대기","추가자료 접수 요청"]},
 {t:"본사 입고 · 진단·수리",d:"입고가 필요한 경우에만",s:["본사 입고","진단·수리중"]},
 {t:"제조사 확인 · 부품 대기",d:"워런티는 보통 1~2주, 길면 4주",s:["제조사 접수","부품·대체품 입고 대기"]},
 {t:"발송 완료",d:"송장번호를 알림톡으로 보내 드려요",s:["출고·발송 완료","선조치 후 크레딧 대기","크레딧·대체품 입수","완료"]}
];
const fmtD=s=>{if(!s)return"";const d=new Date(s.length<=10?s+"T00:00:00":s);return isNaN(d)?s:`${d.getMonth()+1}월 ${d.getDate()}일`};
function track(pre){
  app.innerHTML=`<div class="wrap narrow">
    <div class="crumb"><a href="#home">지원 홈</a> › 진행 조회</div>
    <form class="card" id="tf" novalidate><h2>진행 조회</h2><p class="sub">접수할 때 받은 접수번호와 연락처 뒤 4자리를 넣어 주세요. 대리점 접수는 대리점 번호나 소비자 번호 모두 돼요.</p>
      <div class="field"><label for="t-no">접수번호</label><input id="t-no" class="mono" type="text" placeholder="예: 261125-07" value="${esc(pre||"")}"></div>
      <div class="field"><label for="t-ph">연락처 뒤 4자리</label><input id="t-ph" class="mono" type="text" inputmode="numeric" maxlength="4"></div>
      <button class="btn" type="submit" id="tgo">조회</button><div class="err" id="terr" role="alert"></div><div id="tres"></div></form></div>`;
  $("#tf").onsubmit=async e=>{e.preventDefault();const no=$("#t-no").value.trim(),ph=digits($("#t-ph").value);
    if(!/^\d{6}-\d{2,3}$/.test(no)){$("#terr").textContent="접수번호를 확인해 주세요. (예: 261125-07)";return}
    if(ph.length!==4){$("#terr").textContent="연락처 뒤 4자리를 넣어 주세요.";return}
    $("#terr").textContent="";$("#tgo").disabled=true;$("#tres").innerHTML=`<p class="hint" style="margin-top:18px">조회하는 중…</p>`;
    let r;try{r=await post(CONFIG.HOOK_LOOKUP,{a:"track",no,ph})}catch(x){r=null}
    $("#tgo").disabled=false;
    if(!r||!r.ok){$("#tres").innerHTML=`<p class="err" style="margin-top:18px">지금 조회할 수 없어요. 잠시 뒤 다시 해 주세요.</p>`;return}
    if(!r.found){$("#tres").innerHTML=`<p class="hint" style="margin-top:18px">맞는 접수 건을 찾지 못했어요. 접수번호와 연락처 뒤 4자리를 다시 확인해 주세요.</p>`;return}
    const c={};(r.cols||[]).forEach(x=>c[x.id]=x.text||"");
    const st=c.color_mm8m713b||"신규접수";
    if(st==="보류·취소"){$("#tres").innerHTML=`<div class="note warn" style="margin-top:18px">이 접수 건은 보류되었거나 취소되었어요. 자세한 내용은 ${esc(CONTENT.phone)}로 문의해 주세요.</div>`;return}
    let cur=TRACK_STEPS.findIndex(s=>s.s.includes(st));if(cur<0)cur=0;
    const when=[fmtD(r.created),"",fmtD(c.date_mm8mrba2),"",fmtD(c.date_mm8mjwrp||c.date_mm8m43bf)];
    $("#tres").innerHTML=`<div style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px">
      <div class="hint">${esc([c.single_selectp2osudo,c.short_textclnyzks0,c.single_selectqvr8lbz].filter(Boolean).join(" · "))}</div>
      <ol class="timeline" style="margin-left:0">${TRACK_STEPS.map((s,i)=>`<li class="${i<=cur?"on":""}${i===cur?" now":""}"><b>${s.t}</b><small>${i<=cur?(when[i]||(i===cur?"진행 중":"")):s.d}${i===4&&i<=cur&&c.text_mm8vhq76?` · 송장번호 <span class="mono">${esc(c.text_mm8vhq76)}</span>`:""}</small></li>`).join("")}</ol></div>`};
  if(pre)$("#t-ph").focus();
}

/* ---------- 라우팅 ---------- */
function route(){
  const h=(location.hash||"#home").slice(1);
  let nav="home";
  if(h.startsWith("brand-")){if(!route.last||route.last!==h){brandTab="issues";brandCat=null}brand(h.slice(6))}
  else if(h==="apply"||h.startsWith("apply-")){nav="apply";if(route.last&&!route.last.startsWith("apply"))resetForm();apply(h.startsWith("apply-")?h.slice(6):undefined)}
  else if(h==="track"||h.startsWith("track-")){nav="track";track(h.startsWith("track-")?decodeURIComponent(h.slice(6)):"")}
  else home();
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===nav)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(route.last!==h)scrollTo(0,0);
  route.last=h;
}
addEventListener("hashchange",route);
loadData().then(route);
</script>
